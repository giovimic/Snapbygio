<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Portfolio</title>
</head>
<body>

    <header style="position: fixed; padding: 30px;">
        <h1>Snapbygio</h1>
    </header>

    <main class="gallery" id="gallery">
        <div class="item"><img src="images/foto1.jpg" onclick="openLightbox(this.src)"></div>
        <div class="item"><img src="images/foto2.jpg" onclick="openLightbox(this.src)"></div>
        <div class="item"><img src="images/foto3.jpg" onclick="openLightbox(this.src)"></div>
    </main>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        
        // 1. Scroll con rotella
        gallery.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            gallery.scrollLeft += evt.deltaY;
        });

        // 2. Funzione per ingrandire
        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightbox-img');
            lbImg.src = src;
            lb.style.display = 'flex';
        }
    </script>
</body>
</html>
